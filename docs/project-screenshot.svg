      <text x="14" y="234" font-size="15" fill="#d9d9d9">• Frontend: React, React Native, Vue.js, Next.js, Angular</text>
      <text x="14" y="262" font-size="15" fill="#d9d9d9">• Backend: Python, Django, Laravel, PHP, Node.js, Java</text>
      <text x="14" y="290" font-size="15" fill="#d9d9d9">• Databases &amp; Cloud: MySQL, DynamoDB, AWS Services</text>
